# Builds and checks the site on every pull request. Make "Check / build" a required status check
# on main (branch protection) so a change that breaks the build cannot be merged.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      # --drafts also validates drafts and future-dated articles, so they fail here, not on publish day.
      - run: python build.py --drafts
      - run: python tools/check_site.py
      - run: python build.py
      - run: python tools/check_site.py
