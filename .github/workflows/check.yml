# Builds and checks the site on every pull request. Make "Check / build" a required status check
# on main (branch protection) so a change that breaks the build cannot be merged.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      # --drafts also validates drafts and future-dated articles, so they fail here, not on publish day.
      - run: python build.py --drafts
      - run: python tools/check_site.py
      - run: python build.py
      - run: python tools/check_site.py
